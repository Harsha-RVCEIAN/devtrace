services:
  db:
    image: postgres:18
    container_name: devtrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-devtrace_db}
      POSTGRES_USER: ${DB_USER:-devtrace_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - devtrace_pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devtrace_app} -d ${DB_NAME:-devtrace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devtrace_pgdata:
